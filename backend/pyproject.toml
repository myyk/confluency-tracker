[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.8",
    "django-ninja>=1.6.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests", "plates"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "RUF"]

[tool.ruff.lint.per-file-ignores]
# RUF012 wants ClassVar annotations on mutable class attributes, but Django's
# Meta options (ordering, constraints, indexes) are lists by documented design.
"**/models.py" = ["RUF012"]
